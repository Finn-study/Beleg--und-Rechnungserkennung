name: Naechtliche Verarbeitung

on:
  schedule:
    # Jede Nacht um 02:00 Uhr
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Pakete installieren
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: API starten
        run: python api.py > api.log 2>&1 &

      - name: Belege verarbeiten
        run: python batch.py

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A eingang verarbeitet fehler
          git add -f ergebnisse/ergebnisse.csv
          git commit -m "Neue Ergebnisse" || exit 0
          git push
